description: >-
  Explorium runs no developer-facing changelog. There is no /changelog on the
  docs host (404), no release-notes page on the marketing site (404), no
  releases feed in the GitHub org for the API itself, and no changelog entry in
  either the api-catalog linkset or the ai-catalog manifest. What exists is a
  marketing "Product Updates" blog category with irregular, mostly undated
  posts, plus one small version table buried at the bottom of the error-handling
  reference. Neither is a machine-readable or reliably dated record of API
  change - notable for a provider that ships a beta v2 surface and warns that
  its paths and fields may change before GA.
