description: >-
  FinOps view of Explorium AgentSource spend. Explorium bills through a single
  prepaid credit pool consumed by every action - business and prospect match,
  fetch, stats, autocomplete, single and bulk enrichment, and event tracking -
  across both the REST API and the AgentSource MCP server. A free 100-credit
  developer tier seeds evaluation; production spend is prepaid credit packages
  or a custom enterprise agreement. Because one pool spans all surfaces, cost
  control is about which actions are invoked and how many records each call
  touches rather than per-endpoint invoices.
notes: >-
  Per-credit rates and package sizes are set in the Explorium admin portal and
  not reconciled here. The dominant cost drivers are enrichment volume (each
  enriched record consumes credits) and event/monitoring usage; matching and
  stats calls are typically cheaper reconnaissance steps.
