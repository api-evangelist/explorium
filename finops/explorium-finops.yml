meters:
- name: credits
  description: Shared credit units consumed by every API action; the primary billing meter.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - action
  - dataset
- name: enrichment_records
  description: Records enriched via single or bulk enrichment endpoints; each consumes credits.
  unit: records
  aggregation: sum
  dimensions:
  - account
  - enrichment_type
- name: event_lookups
  description: Business and prospect event fetches and monitored enrollments drawing credits.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - event_type
principles:
- name: Visibility
  description: Track credit burn via GET /v1/credits and attribute it to the actions and datasets that consume it.
- name: Allocation
  description: Tag workflows (prospecting, enrichment, monitoring) so credit consumption maps to internal cost centers.
- name: Optimization
  description: Use stats before large fetches, match once and cache business_id / prospect_id, batch up to 50 records per call, and enrich only needed fields to reduce credit spend.
- name: Accountability
  description: Review prepaid credit balance and expiry against forecasted volume before topping up or moving to enterprise terms.
