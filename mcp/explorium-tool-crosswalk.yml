    file: openapi/_original/explorium-agentsource-openapi.json
    version: OpenAPI 3.1.0
    title: Partner Service 0.3.19
    operations: 127
    gated: false
    note: The spec is anonymous at https://api.explorium.ai/openapi.json; calling it is not.
  mcp:
    url: https://mcp.explorium.ai/mcp
    transport: streamable-http
    gated: true
    note: tools/list returns 401 invalid_token; schemas need authenticated introspection.
  graphql:
