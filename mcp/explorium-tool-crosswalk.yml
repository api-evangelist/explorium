mcp_only:
- tool: estimate-cost
  reason: >-
    No REST operation prices an operation before it runs. /v1/credits and
    /v1/credits/aggregation report balance and consumption AFTER the fact. This
    is a genuine MCP-only capability and a real agent-safety feature - the agent
    can price a query before spending the account's credits on it.
- tool: show-sample
  reason: >-
    No REST equivalent. Previewing rows from a prepared result table before
    paying for the full export is a server-side session concept; the REST API
    has no result-table object to sample.
- tool: export-to-csv
  reason: >-
    No REST equivalent. REST's nearest analogue is the async job pipeline
    (v2_entity_id_lists_upload -> v2_*_job -> v2_job_status), which returns a
    results URL, but that is a different workflow, not this tool.
- tool: get-dataset
  reason: >-
    No REST operation retrieves a previously saved dataset. Datasets are a
    server-side session artifact of the MCP surface.
