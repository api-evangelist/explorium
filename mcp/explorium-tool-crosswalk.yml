description: >-
  Binds each tool Explorium's MCP server card advertises to the REST
  operation(s) that back it, so a tool inherits a real inputSchema from the
  OpenAPI instead of a guessed one. Live tools/list is OAuth-gated (401), so the
  mapping is by name and documented semantics, and confidence is set honestly
  per row. Every operationId below was grepped out of the harvested spec.
