components:
  schemas:
    RequestStatus:
      type: string
      enum:
      - success
      - miss
      - failure
      title: RequestStatus
      description: "The `RequestStatus` class is an enumeration that defines the possible statuses of a request.\n\nThis enum is used to indicate whether a request was successful, missed, or failed. It ensures\nconsistent handling of request statuses across the application.\n\nAttributes:\n    SUCCESS: Indicates that the request was successfully processed.\n    MISS: Indicates that the request did not find any matching data.\n    FAILURE: Indicates that the request encountered an error or failure."
    V2BusinessEnrollmentCreateRequest:
      properties:
        request_context:
          type: 'null'
          title: Request Context
        enrollment_key:
          type: string
          minLength: 4
          title: Enrollment Key
        webhook_id:
          type: string
          title: Webhook Id
        event_types:
          items:
            $ref: '#/components/schemas/EventTypeEnum'
          type: array
          maxItems: 1000
          minItems: 1
        business_ids:
          items:
            type: string
            pattern: ^[a-f0-9]{32}$
          type: array
          maxItems: 1000
          minItems: 1
          title: Business Ids
      additionalProperties: false
      type: object
      required:
      - enrollment_key
      - webhook_id
      - event_types
      - business_ids
      title: V2BusinessEnrollmentCreateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    V2ResponseContext:
      properties:
        correlation_id:
          type: string
          title: Correlation Id
        request_status:
          $ref: '#/components/schemas/RequestStatus'
        time_taken_in_seconds:
          type: number
          title: Time Taken In Seconds
      type: object
      required:
      - correlation_id
      - request_status
      - time_taken_in_seconds
      title: V2ResponseContext
    V2BusinessEnrollment:
      properties:
        enrollment_key:
          type: string
          minLength: 4
          title: Enrollment Key
        enrollment_id:
          type: string
          title: Enrollment Id
