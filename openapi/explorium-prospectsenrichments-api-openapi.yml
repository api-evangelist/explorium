      enum:
      - valid
      - catch_all
      - invalid
      title: EmailValidationStatus
      description: 'The `EmailValidationStatus` class is an enumeration that represents the validation status of an email address.


        This enum is used to categorize email addresses based on their validation results, such as:

        - `VALID`: The email address is valid and deliverable.

        - `CATCH_ALL`: The email address is part of a catch-all domain, meaning it may or may not be deliverable.

        - `INVALID`: The email address is invalid and undeliverable.


        These statuses are used to ensure consistent handling of email validation results across the application.'
