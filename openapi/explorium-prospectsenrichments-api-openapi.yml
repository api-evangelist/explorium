openapi: 3.2.0
info:
  title: Partner Service Prospects Enrichments API
  version: 0.3.19
servers:
- url: https://api.explorium.ai
  description: AgentSource Server
tags:
- name: ProspectsEnrichments
paths:
  /v1/prospects/contacts_information/enrich:
    post:
      tags:
      - ProspectsEnrichments
      summary: Contacts Information
      operationId: prospects_contacts_information_enrich
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectsContactsEnrichRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectsEnrichResponse_ContactsInformationOutputSchema_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
  /v1/prospects/linkedin_posts/enrich:
    post:
      tags:
      - ProspectsEnrichments
      summary: Linkedin Posts
      operationId: prospects_linkedin_posts_enrich
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/partner_service__models__prospects__enrich_requests__LinkedInPostsEnrichRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectsEnrichResponse_LinkedinProspectsPostsOutputSchema_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
  /v1/prospects/profiles/enrich:
    post:
      tags:
      - ProspectsEnrichments
      summary: Profiles
      operationId: prospects_profiles_enrich
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectsEnrichRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectsEnrichResponse_ProfilesOutputSchema_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - APIKeyHeader: []
components:
  schemas:
    JobSeniorityLevel:
      type: string
      enum:
      - owner
      - c-suite
      - vice president
      - director
      - senior non-managerial
      - manager
      - partner
      - non-managerial
      - junior
      - president
      - senior manager
      - advisor
      - freelancer
      - board member
      - founder
      - training
      - unpaid
      title: JobSeniorityLevel
      description: 'The `JobSeniorityLevel` class is an enumeration that represents various levels of job seniority.


        This enum is used to categorize jobs based on their seniority levels, such as:

        - Entry-level positions

        - Managerial roles

        - Executive roles (e.g., C-Suite, VP)


        These categories ensure consistent filtering and classification of job-related data across the application.'
    RequestStatus:
      type: string
      enum:
      - success
      - miss
      - failure
      title: RequestStatus
      description: "The `RequestStatus` class is an enumeration that defines the possible statuses of a request.\n\nThis enum is used to indicate whether a request was successful, missed, or failed. It ensures\nconsistent handling of request statuses across the application.\n\nAttributes:\n    SUCCESS: Indicates that the request was successfully processed.\n    MISS: Indicates that the request did not find any matching data.\n    FAILURE: Indicates that the request encountered an error or failure."
    JobLevel:
      type: string
      enum:
      - owner
      - cxo
      - vp
      - director
      - senior
      - manager
      - partner
      - non-managerial
      - entry
      - training
      - unpaid
      - unknown
      title: JobLevel
      description: 'The `JobLevel` enum for enrichment responses with enhanced taxonomy.

        This is used for v1 fields from enrichment.'
    ProspectsEnrichResponse_ProfilesOutputSchema_:
      properties:
        response_context:
          $ref: '#/components/schemas/ResponseContext'
        data:
          anyOf:
          - $ref: '#/components/schemas/ProfilesOutputSchema'
          - items:
              $ref: '#/components/schemas/ProfilesOutputSchema'
            type: array
          title: Data
        entity_id:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{32}$
          - type: string
            pattern: ^[a-f0-9]{40}$
          title: Entity Id
      type: object
      required:
      - response_context
      title: ProspectsEnrichResponse[ProfilesOutputSchema]
      description: This is base response model for all responses in partner service.
    JobDepartmentEnrichment:
      type: string
      enum:
      - Real estate
      - Customer service
      - Trades
      - Unknown
      - Public relations
      - Legal
      - Operations
      - Media
      - Sales
      - Marketing
      - Finance
      - Engineering
      - Education
      - General
      - Health
      - Design
      - Human resources
      title: JobDepartmentEnrichment
      description: 'The `JobDepartmentEnrichment` enum for enrichment responses with enhanced taxonomy.

        This is used for v1 fields from enrichment.'
    ProspectsContactsEnrichRequest:
      properties:
        request_context:
          type: object
          title: Request Context
          marked_for_null_replacement: true
          nullable: true
        parameters:
          allOf:
          - $ref: '#/components/schemas/ContactsEnrichmentParams'
          title: Parameters
          nullable: true
        prospect_id:
          type: string
          pattern: ^[a-f0-9]{40}$
          title: Prospect Id
          description: The prospect_id to enrich.
      additionalProperties: false
      type: object
      required:
      - prospect_id
      title: ProspectsContactsEnrichRequest
    JobDepartment:
      type: string
      enum:
      - administration
      - real estate
      - healthcare
      - partnerships
      - c-suite
      - design
      - human resources
      - engineering
      - education
      - strategy
      - product
      - sales
      - r&d
      - retail
      - customer success
      - security
      - public service
      - creative
      - it
      - support
      - marketing
      - trade
      - legal
      - operations
      - procurement
      - data
      - manufacturing
      - logistics
      - finance
      title: JobDepartment
      description: 'The `JobDepartment` class is an enumeration that represents various job departments.


        This enum is used to categorize jobs based on their associated departments, such as:

        - Engineering

        - Marketing

        - Sales

        - Legal

        - Customer Service


        These categories ensure consistent filtering and classification of job-related data across the application.'
    ProfilesOutputSchema:
      properties:
        full_name:
          type: string
          title: Full Name
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
