  properties:
  - url: https://developers.explorium.ai/mcp-docs/agentsource-mcp
    type: Documentation
  - url: https://mcp.explorium.ai/mcp
    type: MCPServer
  - url: https://github.com/explorium-ai/mcp-explorium
    type: SourceCode
  description: >-
    Native remote Model Context Protocol server exposing the AgentSource data as 11 agent tools - match-business,
    fetch-businesses, fetch-businesses- statistics, fetch-businesses-events, enrich-business, match-prospects,
    fetch-prospects, fetch-prospects-statistics, fetch-prospects-events, enrich-prospects, and autocomplete.
    Available over streamable HTTP (https://mcp.explorium.ai/mcp) and SSE (https://mcp.explorium.ai/sse),
    and self-hostable via Docker (MIT). Works with Claude Desktop, Cursor, VS Code, n8n, and other MCP
    clients.
