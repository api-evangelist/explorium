aid: explorium
url: https://raw.githubusercontent.com/api-evangelist/explorium/refs/heads/main/apis.yml
name: Explorium
kind: company
description: Explorium is the B2B data layer for AI agents and go-to-market systems. Its AgentSource platform
  is one external-data and enrichment API plus a hosted MCP server, resolving, fetching, enriching and
  monitoring a company dataset and a people dataset aggregated from 100+ external sources. The REST API
  at https://api.explorium.ai publishes an anonymous OpenAPI 3.1 description covering 127 operations across
  two parallel surfaces - v1 (stable) and v2 (beta) - spanning entity matching, filtered fetch with cursor
  pagination, market-sizing statistics, autocomplete, seventeen company enrichment families and three
  people enrichment families (single, bulk to 50, and asynchronous to 10,000), AI-powered research, eighteen
  business and prospect event types delivered over HMAC-signed webhooks, and a shared prepaid credit pool
  that meters every call. Authentication is an api_key header on REST and OAuth 2.0 on MCP. Explorium
  is unusually agent-forward at the discovery layer, serving an RFC 9727 api-catalog, a conformant A2A
  agent card, an MCP server card, an ARD capability catalog, an agent-skills index and llms.txt from its
  own domain.
