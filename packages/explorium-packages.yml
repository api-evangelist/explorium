description: >-
  Explorium publishes NO first-party client library for its REST API in any
  language. Every package it ships wraps the MCP server or a specific agent
  host, and the two that reach a public registry are both materially stale
  relative to the API they front: the OpenAPI at api.explorium.ai was serving
  0.3.19 with a full v2 surface (async jobs, AI research, unified enrichments)
  at probe time, while the PyPI MCP server last shipped 2025-05-13 and the n8n
  node 2025-06-04 - both before v2 existed. An integrator working in Python,
  Java, Go, Ruby, PHP or .NET calls this API with a plain HTTP client and the
  api_key header. The "Python SDK Implementation Guide" in Explorium's docs
  teaches the generic modelcontextprotocol Python SDK, not an Explorium SDK.
rest_sdk:
  published: false
  note: >-
    No first-party REST client library was found on npm, PyPI, Maven Central,
    NuGet, pkg.go.dev, RubyGems, Packagist or crates.io, and none is linked from
    the developer documentation, the GitHub org, or the api-catalog.
