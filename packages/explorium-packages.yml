currency_finding: >-
  Of the seven first-party packages, two reach a public registry and both are
  more than a year old. Every actively-maintained package in the org is an
  agent-host plugin rather than a library. Read against a REST API that shipped
  an entire v2 surface in the interim, this is a provider that has moved its
  client-side investment from SDKs to agent surfaces, and left the registry
  artifacts behind.
