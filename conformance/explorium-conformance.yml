description: >-
  Explorium conforms to an unusually deep stack of AGENT-ERA discovery standards
  - RFC 9727 api-catalog, A2A 1.0.0, MCP with RFC 8414 OAuth metadata and RFC
  7591 dynamic client registration, llms.txt, an ARD/AIR capability catalog and
  an agent-skills index - while skipping most of the classic HTTP-API hygiene
  standards: no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 8594
  sunset headers, no OpenID Connect, no idempotency. That inversion is the
  finding.
standards:
- id: openapi-3.1
  conforms: true
  evidence: >-
    OpenAPI 3.1.0 served anonymously at https://api.explorium.ai/openapi.json,
    120 paths, 127 operations, 316 component schemas, securitySchemes defined
    and applied to 125 operations.
- id: rfc9727-api-catalog
  conforms: true
  evidence: >-
    https://www.explorium.ai/.well-known/api-catalog returns a valid linkset with
    anchor, service-desc (application/vnd.oai.openapi+json), service-doc and
    service-meta relations.
- id: a2a-1.0.0
  conforms: true
  evidence: >-
    Agent card at the canonical /.well-known/agent-card.json, protocolVersion
    0.3.0, capabilities as an object, skills as an array, preferredTransport and
    default I/O modes present. Graded conformant in a2a/explorium-a2a.yml.
- id: mcp
  conforms: true
  evidence: >-
    Hosted Streamable HTTP server at https://mcp.explorium.ai/mcp, with an
    anonymous pre-connection server card at /.well-known/mcp/server-card.json
    and a self-hostable MIT-licensed stdio build.
- id: oauth2
  conforms: true
  evidence: >-
    The MCP surface runs OAuth 2.0 authorization_code + refresh_token; an
    unauthenticated initialize returns WWW-Authenticate: Bearer realm="OAuth".
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: >-
    https://mcp.explorium.ai/.well-known/oauth-authorization-server returns
    issuer, authorization_endpoint, token_endpoint, registration_endpoint,
    revocation_endpoint, grant_types_supported and code_challenge_methods_supported.
- id: rfc7636-pkce
  conforms: true
  evidence: code_challenge_methods_supported includes S256 (and plain).
- id: rfc7591-dynamic-client-registration
  conforms: true
  evidence: registration_endpoint https://mcp.explorium.ai/register is advertised.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: false
  evidence: >-
    /.well-known/oauth-protected-resource returns 404 on mcp.explorium.ai, so an
    MCP client cannot discover the authorization server from the resource; it
    must rely on the WWW-Authenticate challenge.
- id: llmstxt
  conforms: true
  evidence: >-
    /llms.txt served on both www.explorium.ai and developers.explorium.ai, with
    scoped indexes for the blog, resource center, use cases and integrations.
- id: agent-skills
  conforms: true
  evidence: >-
    A skills index at /.well-known/agent-skills/index.json (7 capabilities) and a
    published skill document at
    developers.explorium.ai/.well-known/agent-skills/explorium/skill.md.
- id: ard-ai-catalog
  conforms: true
  evidence: >-
    /.well-known/ai-catalog.json, specVersion 1.0, four entries with urn:air:
    identifiers, per-entry trustManifest and representativeQueries.
- id: apikey-auth
  conforms: true
  evidence: OpenAPI securityScheme APIKeyHeader, apiKey in header named api_key.
- id: openidconnect
  conforms: false
  evidence: No /.well-known/openid-configuration on any host; no openIdConnect scheme in the spec.
- id: oauth-scopes
  conforms: false
  evidence: >-
    The authorization-server metadata advertises no scopes_supported, and no
