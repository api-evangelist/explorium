- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on every Explorium host.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header documented or declared; no deprecation policy published.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key parameter in 127 operations and no idempotency guidance in
