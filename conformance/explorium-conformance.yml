summary:
  agent_era_standards_met: 9
  classic_http_hygiene_standards_missed: 6
  note: >-
    Explorium is one of the most discovery-conformant providers in the catalog
    at the agent layer and one of the least conformant at the runtime-semantics
    layer. An agent can find this API without being told it exists, and then has
    no problem+json, no scopes, no idempotency and no sunset contract once it
    starts calling.
