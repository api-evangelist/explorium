description: >-
  Explorium publishes a complete, priced plan table in machine-readable form at
  https://www.explorium.ai/pricing.md (last-updated 2026-08-12 in the document's
  own front matter), alongside the human page at
  https://www.explorium.ai/pricing/. Four named tiers carry a list price, a
  credit allocation, a derived cost per credit and a validity window; the fifth
  is a custom enterprise agreement. Everything below is quoted from that
  document - no figure here is inferred.
notes: >-
  This supersedes the earlier round's estimate of "roughly 200 USD for 5,000
  credits", which came from a marketing page and does not match the published
  table. Plans are one-time credit purchases, not subscriptions: paid credits
  expire twelve months after purchase, do not carry forward, are non-refundable
  and do not auto-renew. Service stops when the balance is exhausted. Consumption
  is tracked in the admin console at https://admin.explorium.ai.
sources:
- https://www.explorium.ai/pricing.md
- https://www.explorium.ai/pricing/
- https://developers.explorium.ai/reference/credits/credit_plans
- https://developers.explorium.ai/reference/credits/auto-refill-credits
metering:
  unit: credits
  pool: single shared pool across REST and MCP
  consumed_by:
  - Search - returning companies or prospects matching a set of filters
  - Enrichment - adding attributes to a company or person already matched
  - Events - retrieving business or prospect event signals
  counting_note: >-
    Credits are consumed per entity, not per HTTP request. A single request
    carrying 50 businesses consumes 50 credits and 50 rate-limit queries.
  pre_purchase_estimation: >-
    The MCP server exposes estimate-cost to price an operation before it runs,
    and show-sample to preview a result table before paying for a full export.
    Neither has a REST equivalent.
  auto_refill: https://developers.explorium.ai/reference/credits/auto-refill-credits
